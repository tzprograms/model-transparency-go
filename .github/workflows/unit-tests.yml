name: Unit Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Run tests
        run: make test-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  test-pkcs11:
    name: PKCS#11 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      - name: Run PKCS#11 unit tests
        run: make test-pkcs11

  test-fips:
    name: Native FIPS unit and CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: './go.mod'
      - run: make test-fips

  test-fips-container:
    name: Native FIPS container (${{ matrix.containerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containerfile: [Containerfile, Containerfile.pkcs11]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with the validated module
        run: docker build -f "${{ matrix.containerfile }}" --build-arg GOFIPS140=v1.0.0 -t model-signing:fips .
      - name: Verify runtime FIPS mode and module
        run: |
          test "$(docker run --rm model-signing:fips fips-status)" = "enabled=true version=v1.0.0"
          test "$(docker run --rm -e GODEBUG=fips140=off model-signing:fips fips-status)" = "enabled=false version=v1.0.0"
          test "$(docker run --rm -e GODEBUG=fips140=only model-signing:fips fips-status)" = "enabled=true version=v1.0.0"
